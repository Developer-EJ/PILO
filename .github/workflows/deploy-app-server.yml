name: Deploy App Server

on:
  push:
    branches: ["main"]
    paths:
      - "apps/app-server/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-app-server
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: pilo-app-server
  APP_PATH: apps/app-server
  CONTAINER_NAME: app-server
  WORKER_CONTAINER_NAME: github-sync-worker

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Capture rollback state
        id: previous
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_APP_SERVER_SERVICE: ${{ vars.ECS_APP_SERVER_SERVICE }}
          ECS_APP_SERVER_LOG_GROUP: ${{ vars.ECS_APP_SERVER_LOG_GROUP }}
        run: |
          set -euo pipefail
          test -n "$ECS_CLUSTER_NAME"
          test -n "$ECS_APP_SERVER_SERVICE"

          service_json=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_APP_SERVER_SERVICE")
          jq -e \
            --arg service "$ECS_APP_SERVER_SERVICE" '
              (.failures | length) == 0
              and .services[0].serviceName == $service
              and .services[0].desiredCount >= 1
            ' <<< "$service_json" > /dev/null

          previous_task_definition=$(jq -er '.services[0].taskDefinition' <<< "$service_json")
          previous_desired_count=$(jq -er '.services[0].desiredCount' <<< "$service_json")
          task_arn=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --service-name "$ECS_APP_SERVER_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          test -n "$task_arn"
          test "$task_arn" != "None"

          task_json=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$task_arn")
          previous_image_digest=$(jq -er \
            --arg container "$CONTAINER_NAME" '
              .tasks[0].containers[]
              | select(.name == $container)
              | .imageDigest
            ' <<< "$task_json")

          aws ecs describe-task-definition \
            --task-definition "$previous_task_definition" \
            --query taskDefinition > previous-task-definition.json
          jq -e \
            --arg container "$CONTAINER_NAME" '
              any(.containerDefinitions[]; .name == $container)
            ' previous-task-definition.json > /dev/null

          log_group="${ECS_APP_SERVER_LOG_GROUP:-}"
          if [[ -z "$log_group" ]]; then
            service_prefix="${ECS_APP_SERVER_SERVICE%-app-server}"
            if [[ "$service_prefix" == "$ECS_APP_SERVER_SERVICE" ]]; then
              echo "Set ECS_APP_SERVER_LOG_GROUP for a non-standard service name." >&2
              exit 1
            fi
            log_group="/ecs/${service_prefix}/app-server"
          fi

          log_groups=$(aws logs describe-log-groups \
            --log-group-name-prefix "$log_group" \
            --query 'logGroups[].logGroupName' \
            --output json)
          jq -e --arg name "$log_group" 'index($name) != null' \
            <<< "$log_groups" > /dev/null

          {
            echo "task_definition=$previous_task_definition"
            echo "desired_count=$previous_desired_count"
            echo "image_uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}@${previous_image_digest}"
            echo "log_group=$log_group"
          } >> "$GITHUB_OUTPUT"

      - name: Capture optional worker rollback state
        id: previous-worker
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_GITHUB_SYNC_WORKER_SERVICE: ${{ vars.ECS_GITHUB_SYNC_WORKER_SERVICE }}
        run: |
          set -euo pipefail
          if [[ -z "${ECS_GITHUB_SYNC_WORKER_SERVICE:-}" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          worker_service_json=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_GITHUB_SYNC_WORKER_SERVICE")
          worker_service_name=$(jq -r '.services[0].serviceName // empty' \
            <<< "$worker_service_json")
          if [[ "$worker_service_name" != "$ECS_GITHUB_SYNC_WORKER_SERVICE" ]]; then
            echo "GitHub sync worker service does not exist yet; skipping."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -e '
            (.failures | length) == 0
            and .services[0].desiredCount >= 1
          ' <<< "$worker_service_json" > /dev/null
          previous_worker_task_definition=$(jq -er \
            '.services[0].taskDefinition' <<< "$worker_service_json")
          previous_worker_desired_count=$(jq -er \
            '.services[0].desiredCount' <<< "$worker_service_json")
          worker_task_arn=$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --service-name "$ECS_GITHUB_SYNC_WORKER_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)
          test -n "$worker_task_arn"
          test "$worker_task_arn" != "None"

          worker_task_json=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "$worker_task_arn")
          previous_worker_image_digest=$(jq -er \
            --arg container "$WORKER_CONTAINER_NAME" '
              .tasks[0].containers[]
              | select(.name == $container)
              | .imageDigest
            ' <<< "$worker_task_json")

          aws ecs describe-task-definition \
            --task-definition "$previous_worker_task_definition" \
            --query taskDefinition > previous-worker-task-definition.json
          jq -e \
            --arg container "$WORKER_CONTAINER_NAME" '
              any(.containerDefinitions[]; .name == $container)
            ' previous-worker-task-definition.json > /dev/null

          {
            echo "exists=true"
            echo "task_definition=$previous_worker_task_definition"
            echo "desired_count=$previous_worker_desired_count"
            echo "image_uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}@${previous_worker_image_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Register logged task definition
        id: task-definition
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          APP_SERVER_LOG_GROUP: ${{ steps.previous.outputs.log_group }}
        run: |
          set -euo pipefail

          jq \
            --arg container "$CONTAINER_NAME" \
            --arg image "$IMAGE_URI" \
            --arg log_group "$APP_SERVER_LOG_GROUP" \
            --arg region "$AWS_REGION" '
              .containerDefinitions |= map(
                if .name == $container then
                  .image = $image
                  | .logConfiguration = {
                      logDriver: "awslogs",
                      options: {
                        "awslogs-group": $log_group,
                        "awslogs-region": $region,
                        "awslogs-stream-prefix": "app-server"
                      }
                    }
                else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' previous-task-definition.json > next-task-definition.json

          jq -e \
            --arg container "$CONTAINER_NAME" \
            --arg image "$IMAGE_URI" \
            --arg log_group "$APP_SERVER_LOG_GROUP" \
            --arg region "$AWS_REGION" '
              [
                .containerDefinitions[]
                | select(
                    .name == $container
                    and .image == $image
                    and .logConfiguration.logDriver == "awslogs"
                    and .logConfiguration.options["awslogs-group"] == $log_group
                    and .logConfiguration.options["awslogs-region"] == $region
                    and .logConfiguration.options["awslogs-stream-prefix"] == "app-server"
                  )
              ] | length == 1
            ' next-task-definition.json > /dev/null

          new_task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://next-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          test -n "$new_task_definition"
          echo "arn=$new_task_definition" >> "$GITHUB_OUTPUT"

      - name: Register optional worker task definition
        if: ${{ steps.previous-worker.outputs.exists == 'true' }}
        id: worker-task-definition
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq \
            --arg container "$WORKER_CONTAINER_NAME" \
            --arg image "$IMAGE_URI" '
              .containerDefinitions |= map(
                if .name == $container then .image = $image else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' previous-worker-task-definition.json > next-worker-task-definition.json

          jq -e \
            --arg container "$WORKER_CONTAINER_NAME" \
            --arg image "$IMAGE_URI" '
              [
                .containerDefinitions[]
                | select(.name == $container and .image == $image)
              ] | length == 1
            ' next-worker-task-definition.json > /dev/null

          new_worker_task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://next-worker-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          test -n "$new_worker_task_definition"
          echo "arn=$new_worker_task_definition" >> "$GITHUB_OUTPUT"

      - name: Deploy one-task canary
        id: deploy-canary
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_APP_SERVER_SERVICE: ${{ vars.ECS_APP_SERVER_SERVICE }}
        run: |
          set -euo pipefail
          echo "started_ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_APP_SERVER_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.arn }}" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_APP_SERVER_SERVICE"

      - name: Verify one-task canary
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_APP_SERVER_SERVICE: ${{ vars.ECS_APP_SERVER_SERVICE }}
          APP_SERVER_URL: ${{ vars.NEXT_PUBLIC_PILO_APP_SERVER_URL }}
          APP_SERVER_LOG_GROUP: ${{ steps.previous.outputs.log_group }}
          CANARY_STARTED_MS: ${{ steps.deploy-canary.outputs.started_ms }}
        run: |
          set -euo pipefail
          service_json=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_APP_SERVER_SERVICE")
          jq -e \
            --arg task_definition "${{ steps.task-definition.outputs.arn }}" '
              .services[0].taskDefinition == $task_definition
              and .services[0].desiredCount == 1
              and .services[0].runningCount == 1
              and .services[0].pendingCount == 0
            ' <<< "$service_json" > /dev/null

          readarray -t task_arns < <(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --service-name "$ECS_APP_SERVER_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns[]' \
            --output text | tr '\t' '\n')
          test "${#task_arns[@]}" -ge 1
          task_json=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER_NAME" \
            --tasks "${task_arns[@]}")
          canary_task_arn=$(jq -er \
            --arg task_definition "${{ steps.task-definition.outputs.arn }}" '
              [
                .tasks[]
                | select(
                    .taskDefinitionArn == $task_definition
                    and .lastStatus == "RUNNING"
                  )
                | .taskArn
              ]
              | if length == 1 then .[0]
                else error("expected exactly one running canary task")
                end
            ' <<< "$task_json")
          canary_task_id="${canary_task_arn##*/}"
          expected_log_stream="app-server/${CONTAINER_NAME}/${canary_task_id}"

          test -n "$APP_SERVER_URL"
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors \
            "${APP_SERVER_URL%/}/api/v1/health" > /dev/null

          log_ready=false
          for _ in {1..12}; do
            if log_events=$(aws logs get-log-events \
              --log-group-name "$APP_SERVER_LOG_GROUP" \
              --log-stream-name "$expected_log_stream" \
              --start-time "$CANARY_STARTED_MS" \
              --start-from-head \
              --limit 10 \
              --no-paginate 2>/dev/null); then
              if jq -e \
                --argjson started "$CANARY_STARTED_MS" '
                  any(.events[]?; .timestamp >= $started)
                ' <<< "$log_events" > /dev/null; then
                log_ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$log_ready" = "true"

      - name: Restore intended task count
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_APP_SERVER_SERVICE: ${{ vars.ECS_APP_SERVER_SERVICE }}
          TARGET_COUNT: ${{ steps.previous.outputs.desired_count }}
        run: |
          set -euo pipefail
          test "$TARGET_COUNT" -ge 1
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_APP_SERVER_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.arn }}" \
            --desired-count "$TARGET_COUNT"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_APP_SERVER_SERVICE"

      - name: Deploy optional GitHub sync worker
        if: ${{ steps.previous-worker.outputs.exists == 'true' }}
        id: deploy-worker
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_GITHUB_SYNC_WORKER_SERVICE: ${{ vars.ECS_GITHUB_SYNC_WORKER_SERVICE }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_GITHUB_SYNC_WORKER_SERVICE" \
            --task-definition "${{ steps.worker-task-definition.outputs.arn }}" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_GITHUB_SYNC_WORKER_SERVICE"

      - name: Verify optional worker task
        if: ${{ steps.previous-worker.outputs.exists == 'true' }}
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_GITHUB_SYNC_WORKER_SERVICE: ${{ vars.ECS_GITHUB_SYNC_WORKER_SERVICE }}
        run: |
          set -euo pipefail
          worker_service_json=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_GITHUB_SYNC_WORKER_SERVICE")
          jq -e \
            --arg task_definition "${{ steps.worker-task-definition.outputs.arn }}" '
              .services[0].taskDefinition == $task_definition
              and .services[0].desiredCount == 1
              and .services[0].runningCount == 1
              and .services[0].pendingCount == 0
            ' <<< "$worker_service_json" > /dev/null

      - name: Restore optional worker task count
        if: ${{ steps.previous-worker.outputs.exists == 'true' }}
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_GITHUB_SYNC_WORKER_SERVICE: ${{ vars.ECS_GITHUB_SYNC_WORKER_SERVICE }}
          TARGET_COUNT: ${{ steps.previous-worker.outputs.desired_count }}
        run: |
          set -euo pipefail
          test "$TARGET_COUNT" -ge 1
          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_GITHUB_SYNC_WORKER_SERVICE" \
            --task-definition "${{ steps.worker-task-definition.outputs.arn }}" \
            --desired-count "$TARGET_COUNT"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_GITHUB_SYNC_WORKER_SERVICE"

      - name: Roll back failed deployment
        if: ${{ failure() && (steps.deploy-canary.outcome == 'success' || steps.deploy-canary.outcome == 'failure') }}
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_APP_SERVER_SERVICE: ${{ vars.ECS_APP_SERVER_SERVICE }}
          ECS_GITHUB_SYNC_WORKER_SERVICE: ${{ vars.ECS_GITHUB_SYNC_WORKER_SERVICE }}
          PREVIOUS_IMAGE_URI: ${{ steps.previous.outputs.image_uri }}
          PREVIOUS_WORKER_IMAGE_URI: ${{ steps.previous-worker.outputs.image_uri }}
          ROLLBACK_DESIRED_COUNT: ${{ steps.previous.outputs.desired_count }}
          ROLLBACK_WORKER_DESIRED_COUNT: ${{ steps.previous-worker.outputs.desired_count }}
          ROLLBACK_WORKER: ${{ steps.previous-worker.outputs.exists == 'true' && (steps.deploy-worker.outcome == 'success' || steps.deploy-worker.outcome == 'failure') }}
        run: |
          set -euo pipefail
          if [[ "$ROLLBACK_WORKER" == "true" ]]; then
            jq \
              --arg container "$WORKER_CONTAINER_NAME" \
              --arg image "$PREVIOUS_WORKER_IMAGE_URI" '
                .containerDefinitions |= map(
                  if .name == $container then .image = $image else . end
                )
                | del(
                    .taskDefinitionArn,
                    .revision,
                    .status,
                    .requiresAttributes,
                    .compatibilities,
                    .registeredAt,
                    .registeredBy
                  )
              ' previous-worker-task-definition.json > rollback-worker-task-definition.json

            rollback_worker_task_definition=$(aws ecs register-task-definition \
              --cli-input-json file://rollback-worker-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text)
            aws ecs update-service \
              --cluster "$ECS_CLUSTER_NAME" \
              --service "$ECS_GITHUB_SYNC_WORKER_SERVICE" \
              --task-definition "$rollback_worker_task_definition" \
              --desired-count 1 \
              --force-new-deployment
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_GITHUB_SYNC_WORKER_SERVICE"

            if [[ "$ROLLBACK_WORKER_DESIRED_COUNT" -gt 1 ]]; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER_NAME" \
                --service "$ECS_GITHUB_SYNC_WORKER_SERVICE" \
                --task-definition "$rollback_worker_task_definition" \
                --desired-count "$ROLLBACK_WORKER_DESIRED_COUNT"
              aws ecs wait services-stable \
                --cluster "$ECS_CLUSTER_NAME" \
                --services "$ECS_GITHUB_SYNC_WORKER_SERVICE"
            fi
          fi

          jq \
            --arg container "$CONTAINER_NAME" \
            --arg image "$PREVIOUS_IMAGE_URI" '
              .containerDefinitions |= map(
                if .name == $container then .image = $image else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ' previous-task-definition.json > rollback-task-definition.json

          rollback_task_definition=$(aws ecs register-task-definition \
            --cli-input-json file://rollback-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_APP_SERVER_SERVICE" \
            --task-definition "$rollback_task_definition" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_APP_SERVER_SERVICE"

          if [[ "$ROLLBACK_DESIRED_COUNT" -gt 1 ]]; then
            aws ecs update-service \
              --cluster "$ECS_CLUSTER_NAME" \
              --service "$ECS_APP_SERVER_SERVICE" \
              --task-definition "$rollback_task_definition" \
              --desired-count "$ROLLBACK_DESIRED_COUNT"
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_APP_SERVER_SERVICE"
          fi
